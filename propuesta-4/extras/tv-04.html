<!doctype html><html lang="es"><head><meta charset="utf-8"><title>tv-04</title><link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet"><style>
:root{--navy:#04255f;--blue:#0a4aa8;--cyan:#1EB7FF;--gold:#F7C32E;--font:"Open Sans",system-ui,Arial,sans-serif}

.gold{color:var(--gold)}
.k{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.white{background:#fff;color:var(--navy);box-shadow:0 8px 0 rgba(0,10,60,.28)}

.qrb b{display:block;font-weight:800;line-height:1.05}
