<!doctype html><html lang="es"><head><meta charset="utf-8"><title>banner-formulario</title><link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet"><style>
:root{--navy:#04255f;--blue:#0a4aa8;--cyan:#1EB7FF;--gold:#F7C32E;--font:"Open Sans",system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:400px}
body{position:relative;overflow:hidden;background:#073a8c;font-family:var(--font);color:#fff;line-height:1.25}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0}
.dots{position:absolute;left:0;top:0;width:55%;height:60%;background-image:radial-gradient(rgba(255,255,255,.2) 2.2px,transparent 2.6px);background-size:14px 14px;-webkit-mask-image:linear-gradient(100deg,#000 0,transparent 85%);mask-image:linear-gradient(100deg,#000 0,transparent 85%)}
.z{position:absolute;z-index:2}
.chip{display:inline-block;font-weight:800;border-radius:999px;padding:.3em .9em;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);margin-right:12px}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.card{background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.35);border-radius:30px}
.gold{color:var(--gold)}
.k{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.white{background:#fff;color:var(--navy);box-shadow:0 8px 0 rgba(0,10,60,.28)}
.qrb{background:#fff;color:var(--navy);display:flex;align-items:center;box-shadow:0 8px 0 rgba(0,0,60,.25)}
.qrb img{display:block;flex:none}
.qrb small{display:block;font-weight:700;color:var(--blue)}
.qrb b{display:block;font-weight:800;line-height:1.05}
.qrb i{display:inline-block;font-style:normal;background:var(--navy);color:#fff;border-radius:999px;font-weight:700}

<div class="z" style="left:56px;top:40px;font-size:24px"><span class="chip on">Gratuito</span><span class="chip">100 % virtual</span></div>
<div class="z" style="left:56px;top:120px;width:1100px"><p style="font-weight:600;font-size:40px;line-height:1.1">Microtaller UIFCE · Contabilidad en la nube con</p>
<h1 style="font-weight:800;font-size:112px;line-height:.98;letter-spacing:-.03em;text-transform:uppercase;margin-left:-4px">QuickBooks</h1>
<p style="font-weight:700;font-size:34px;margin-top:6px;color:var(--gold)">Vie. 27 nov y mié. 2 dic · 11 a. m. – 1 p. m.</p></div><img class="z" src="../assets/uifcito-cierre.png" alt="Uifcito" style="right:90px;top:112px;height:280px;filter:drop-shadow(0 22px 28px rgba(0,10,60,.45))"><div class="z white" style="right:330px;bottom:36px;border-radius:22px;padding:12px 28px"><img src="../assets/logo-quickbooks.png" style="height:44px;display:block" alt="QuickBooks"></div></body></html>
